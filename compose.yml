# Every name is documented in .env.example. `docker compose run --rm test` = the deterministic
# suite (scripts/ci/suite.sh); `docker compose run --rm agentic` = the model-driven example.
x-build: &build
  context: .
  args:
    RUBY_VERSION: ${TEST_RUBY_VERSION:?set TEST_RUBY_VERSION in .env (.env.example)}
    BUNDLE_GEMFILE: ${TEST_GEMFILE:?set TEST_GEMFILE in .env (.env.example)}

services:
  # No network at all: proves the deterministic gate needs no model, no telemetry and
  # nothing outside the container (the app and the browser run in it).
  test:
    build: *build
    network_mode: none
    environment:
      E2E_RB_PROJECT_DIR: /gem/example
      E2E_TELEMETRY_DISABLED: "1"
      CI: "1"
    command: scripts/ci/suite.sh

  # Agent steps against a real model (E2E_MODEL_*; .env.example). To reach a server that
  # listens only on a docker network, add compose.model-network.yml (COMPOSE_FILE in .env).
  agentic:
    build: *build
    environment:
      E2E_RB_PROJECT_DIR: /gem/example
      E2E_TELEMETRY_DISABLED: "1"
      E2E_MODEL: ${E2E_MODEL:-}
      E2E_MODEL_PROVIDER: ${E2E_MODEL_PROVIDER:-}
      E2E_MODEL_BASE_URL: ${E2E_MODEL_BASE_URL:-}
      E2E_MODEL_API_KEY: ${E2E_MODEL_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      CI: "1"
    command: bundle exec rspec example/spec/agentic_spec.rb
